[project]
name = "campus-trade-ai"
version = "0.1.0"
description = "校园二手助手 agent 服务（LangGraph + RAG + 记忆）"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "langchain-core==1.8.4",
    "langchain-deepseek==1.2.1",
    "langchain-openai==1.8.5",
    "langfuse==5.2.0",
    "langgraph==1.2.24",
    "langgraph-checkpoint-redis==0.6.0",
    "pydantic-settings==2.16.3",
    "pymysql==1.2.4",
    "redis==8.1.0",
    "redisvl==0.32.1",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fakeredis[lua]==2.41.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

# Linux（Docker）上用 CPU 版 torch，避免拉取数 GB 的 CUDA 依赖；macOS 走 PyPI
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
