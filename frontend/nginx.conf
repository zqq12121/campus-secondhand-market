# 本地 / 内网 HTTP 部署（docker compose --profile app）。生产 HTTPS 见 deploy/nginx/https.conf.template
map $scheme $hsts { https "max-age=31536000"; default ""; }
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app-locations.conf;
}
