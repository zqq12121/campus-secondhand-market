# 用户端 /、管理后台 /admin/（均为 history 路由）；/api、/ws、/uploads 转发到后端
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    # 跳转用相对地址，避免映射到非 80 端口时丢端口
    absolute_redirect off;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /admin { return 301 /admin/; }
    # HTML 入口不缓存（每次向服务器确认），否则发版后浏览器仍引用旧的带哈希资源
    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri /admin.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|uploads|swagger-ui|v3/api-docs)(/|\.html|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx 是最外层入口：覆盖而非追加，防止客户端伪造 IP 绕过限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(ws|ws-sockjs)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
}
