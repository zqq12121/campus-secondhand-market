# 用户端 /、管理后台 /admin/（均为 history 路由）；/api、/ws、/uploads 转发到后端。
# 被 HTTP（本地 / 内网）与 HTTPS（生产）两份 server 配置共同 include
root /usr/share/nginx/html;
client_max_body_size 6m;
# 跳转用相对地址，避免映射到非 80 端口时丢端口
absolute_redirect off;
server_tokens off;
include /etc/nginx/snippets/security-headers.conf;

location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location = /admin { return 301 /admin/; }
# HTML 入口不缓存（每次向服务器确认），否则发版后浏览器仍引用旧的带哈希资源
location /admin/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /admin.html;
}

location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
}

# ai-service 的 Prometheus 指标只给内网抓取（直接访问 ai:8090），不对外暴露；精确匹配优先于下面的 ^~
location = /api/v1/ai/metrics {
    return 404;
}

# 校园二手助手（Python ai-service）；^~ 优先于下面的正则匹配。SSE 需关闭缓冲。
# 用变量 + Docker 内置 DNS 在请求时才解析：ai 未启动（如没配 DEEPSEEK_API_KEY）只影响助手，不会让 Nginx 起不来
location ^~ /api/v1/ai/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ai_upstream http://ai:8090;
    proxy_pass $ai_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 用户上传的图片：只允许当图片展示，禁止被当成页面执行
location ^~ /uploads/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    include /etc/nginx/snippets/security-headers.conf;
}

location ~ ^/(api|swagger-ui|v3/api-docs)(/|\.html|$) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx 是最外层入口：覆盖而非追加，防止客户端伪造 IP 绕过限流
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(ws|ws-sockjs)(/|$) {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
