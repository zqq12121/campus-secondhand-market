# 本地开发依赖：MySQL 8 + Redis + RabbitMQ。密码从同目录 .env 读取（参考 .env.example）
# docker compose up -d                 只起依赖，后端 / 前端在本机跑
# docker compose --profile app up -d   连同后端 + 前端（Nginx）一起起，访问 http://localhost:${WEB_PORT:-8088}
name: campus-trade
services:
  mysql:
    image: mysql:8.4
    container_name: campus-trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/init_data.sql:/docker-entrypoint-initdb.d/02-init_data.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    container_name: campus-trade-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: campus-trade-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"

  backend:
    profiles: ["app"]
    build: ./backend
    image: campus-trade-backend
    container_name: campus-trade-backend
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      # 经 Nginx 转发，按 X-Forwarded-For 取真实 IP（限流按 IP 计）
      SERVER_FORWARD_HEADERS_STRATEGY: native
      UPLOAD_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}/uploads
      PAY_RETURN_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}/order/{orderId}?from=alipay
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  frontend:
    profiles: ["app"]
    build: ./frontend
    image: campus-trade-frontend
    container_name: campus-trade-frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads:
