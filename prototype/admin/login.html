<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台登录</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: #0B2A22; padding: 16px; }
  .box { width: 100%; max-width: 380px; }
</style>
</head>
<body>
<form class="box card card-pad stack" onsubmit="location.href='dashboard.html';return false">
  <div class="logo" style="justify-content:center"><span class="logo-mark"><i data-icon="package"></i></span>WU 校园闲置 · 管理后台</div>
  <div class="field"><label for="a-u">管理员账号</label><div class="input-affix"><i data-icon="user"></i><input id="a-u" class="input" autocomplete="username"></div></div>
  <div class="field"><label for="a-p">密码</label><div class="input-affix"><i data-icon="lock"></i><input id="a-p" class="input" type="password" autocomplete="current-password"></div></div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">登录</button>
  <p class="subtle" style="text-align:center">管理员账号由超级管理员创建</p>
</form>
<script src="../assets/app.js"></script>
</body>
</html>
